- route:
    id: route-2215
    from:
      uri: direct:getAllTickets
      steps:
        - doTry:
            steps:
              - toD:
                  uri: sql
                  parameters:
                    query: SELECT * FROM tickets
                    dataSource: "#postgreDatabase"
              - log:
                  message: ${body}
              - to:
                  uri: velocity
                  parameters:
                    resourceUri: templates/get-all-tickets.vm
              - setHeader:
                  name: Content-Type
                  constant:
                    expression: application/json
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - log:
                      message: '{"success": false, "message": "Unexpected error fetching tickets:
                        ${exception.message}"}'
                  - setHeader:
                      name: CamelHttpResponseCode
                      simple:
                        expression: "500"
                  - setBody:
                      simple:
                        expression: |-
                          {
                            "success": false,
                            "message": "${exception.message}"
                          }
- route:
    id: route-2216
    from:
      uri: direct:getTicketById
      steps:
        - doTry:
            steps:
              - to:
                  uri: direct:validate-ticket-id
              - toD:
                  uri: sql
                  parameters:
                    query: SELECT * FROM tickets WHERE id = ${header.ticketId}
                    dataSource: "#postgreDatabase"
                    outputType: SelectOne
              - choice:
                  when:
                    - simple: ${body} == null
                      steps:
                        - setHeader:
                            name: CamelHttpResponseCode
                            constant:
                              expression: "404"
                        - setBody:
                            simple:
                              expression: '{"success":false,"message":"Ticket not found"}'
                        - setHeader:
                            name: Content-Type
                            constant:
                              expression: application/json
                        - stop: {}
              - log:
                  message: ${body}
              - to:
                  uri: velocity
                  parameters:
                    resourceUri: templates/get-ticket-by-id.vm
              - setHeader:
                  name: Content-Type
                  constant:
                    expression: application/json
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - log:
                      message: '{"success": false, "message": "Unexpected error fetching ticket:
                        ${exception.message}"}'
                  - log:
                      message: "SQL failure: ${exception.stacktrace}"
                  - setHeader:
                      name: CamelHttpResponseCode
                      simple:
                        expression: "500"
                  - setBody:
                      simple:
                        expression: |-
                          {
                            "success": false,
                            "message": "${exception.message}"
                          }
