- route:
    id: create-ticket-route
    from:
      uri: direct:createTicket
      steps:
        - doTry:
            steps:
              - unmarshal:
                  json:
                    library: Jackson
              - log:
                  message: ${body}
              - setHeaders:
                  headers:
                    - name: employeeId
                      simple:
                        expression: ${body[reportedBy][employeeId]}
                    - name: ticketPriority
                      simple:
                        expression: ${body[priority]}
                    - name: ticketStatus
                      simple:
                        expression: ${body[status]}
                    - name: ticketDescription
                      simple:
                        expression: ${body[description]}
                    - name: ticketTitle
                      simple:
                        expression: ${body[title]}
              - choice:
                  when:
                    - simple:
                        expression: ${headers.ticketTitle} == null || ${headers.ticketDescription} ==
                          null || ${headers.ticketStatus} == null ||
                          ${headers.ticketPriority} == null ||
                          ${headers.ticketTitle} == '' ||
                          ${headers.ticketDescription} == '' ||
                          ${headers.ticketStatus} == '' ||
                          ${headers.ticketPriority} == ''
                      steps:
                        - throwException:
                            exceptionType: java.lang.IllegalArgumentException
                            message: All fields are required
              - to:
                  uri: direct:validate-ticket-enums
              - toD:
                  uri: sql
                  parameters:
                    query: INSERT INTO tickets (employee_id, title, description, status, priority)
                      VALUES (:#employeeId, :#ticketTitle, :#ticketDescription,
                      :#ticketStatus, :#ticketPriority)
                    dataSource: "#postgreDatabase"
              - to:
                  uri: velocity
                  parameters:
                    resourceUri: templates/ticket-created.vm
            doCatch:
              - exception:
                  - java.lang.Exception
                steps:
                  - log:
                      message: '{"success": false, "message": "${exception.message}"}'
                  - setHeader:
                      name: CamelHttpResponseCode
                      simple:
                        expression: "400"
                  - setBody:
                      simple:
                        expression: |-
                          {
                            "success": false,
                            "message": "${exception.message}"
                          }

