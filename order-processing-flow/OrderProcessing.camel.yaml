- rest:
    path: /api
    post:
      - path: /orders
        consumes: application/json
        produces: application/json
        to: direct:processOrder

- route:
    id: process-order
    from:
      uri: direct:processOrder
      steps:
        - unmarshal:
            json:
              library: Jackson

        - setHeader:
            name: orderId
            simple: "${body[orderId]}"

        - setVariable:
            name: deliveryCharge
            constant: "100"

        - setProperty:
            name: orderType
            constant: "ONLINE"

        - setVariable:
            name: paymentAmount
            simple: "${body[payments][0][amount]}"

        - log:
            message: "Received order: ${header.orderId}"

        - log:
            message: "Delivery Charge: ${variable.deliveryCharge}"

        - log:
            message: "Order Type: ${exchangeProperty.orderType}"

        - choice:
            when:
              - simple: "${exchangeProperty.orderType} == 'ONLINE'"
                steps:
                  - log:
                      message: "Processing ONLINE order"
              - simple: "${exchangeProperty.orderType} == 'OFFLINE'"
                steps:
                  - log:
                      message: "Processing OFFLINE order"
            otherwise:
              steps:
                  - log:
                      message: "Unknown order type"

        - filter:
            simple: "${variable.paymentAmount} > 0"
            steps:
              - log:
                  message: "Payment is valid: ${variable.paymentAmount}"

        - split:
            simple: "${body[items]}"
            steps:
              - log:
                  message: "Item: ${body}"

              - filter:
                  simple: "${body[quantity]} > 0"
                  steps:
                    - log:
                        message: "Valid item: ${body[name]}, Quantity: ${body[quantity]}"

        - setBody:
            simple: |
              {
                "status": "success",
                "orderId": "${header.orderId}",
                "data": "${body}"
              }