- rest:
    path: /api
    post:
      - path: /orders
        consumes: application/json
        produces: application/json
        to: direct:processOrder

- route:
    id: process-order
    from:
      uri: direct:processOrder
      steps:
        - unmarshal:
            json:
              library: Jackson

        - setHeader:
            name: orderId
            simple: "${body[orderId]}"

        - setVariable:
            name: deliveryCharge
            constant: "100"

        - setProperty:
            name: orderType
            constant: "ONLINE"

        - log:
            message: "Received order: ${header.orderId}"

        - log:
            message: "Delivery Charge: ${variable.deliveryCharge}"

        - log:
            message: "Order Type: ${exchangeProperty.orderType}"

        - setBody:
            simple: |
              {
                "status": "success",
                "orderId": "${header.orderId}",
                "data": "${body}"
              }